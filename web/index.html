<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar Chat</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f3f1ee; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2dfda;
    --accent: #2f6fed; --bot: #efece7; --user: #2f6fed; --user-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --panel: #212326; --ink: #f2f2f3; --muted: #9a9aa0; --line: #33353a; --bot: #2c2e32; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { height: 100dvh; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
         display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .stage { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: radial-gradient(120% 90% at 50% 20%, color-mix(in srgb, var(--panel) 85%, transparent), transparent), var(--bg);
           border: 1px solid var(--line); min-height: 320px; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #mixbars { position: absolute; left: 12px; bottom: 34px; width: 168px; padding: 8px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; display: none; }
  #mixbars .row { display: grid; grid-template-columns: 62px 1fr 30px; align-items: center; gap: 6px; line-height: 1.7; }
  #mixbars .name { color: var(--muted); }
  #mixbars .track { display: block; height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
  #mixbars .fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #mixbars .val { text-align: right; font-variant-numeric: tabular-nums; }
  .hud { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; pointer-events: none; }
  .emotion { position: absolute; right: 12px; top: 12px; font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  #bubble { position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); width: max-content; max-width: min(86%, 480px); padding: 12px 18px; border-radius: 20px;
            background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.12); opacity: 0; transition: opacity .25s, transform .25s;
            text-align: center; white-space: pre-wrap; word-break: break-word; font-size: 16px; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; background: var(--panel); border: solid var(--line); border-width: 0 1px 1px 0; transform: translateX(-50%) rotate(45deg); }
  #bubble.show { opacity: 1; transform: translate(-50%, 0); }
  #bubble.pending { color: var(--muted); letter-spacing: 3px; }
  #bubble.err { color: #c62828; }
  #reset { position: absolute; left: 12px; top: 12px; padding: 4px 12px; font-size: 13px; opacity: .8; }
  form { display: flex; gap: 8px; width: 100%; max-width: 640px; margin: 0 auto; flex: none; }
  input[type=text] { flex: 1; font: inherit; padding: 10px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; }
  #debug { display: none; position: absolute; right: 12px; top: 44px; width: 300px; max-width: calc(100% - 24px); max-height: calc(100% - 100px); overflow: auto; padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  #debug.open { display: block; }
  .srow { display: grid; grid-template-columns: 110px 1fr 42px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .srow output { text-align: right; font-variant-numeric: tabular-nums; }
  #emoButtons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #emoButtons button { padding: 4px 12px; font-size: 13px; }
  @media (max-width: 800px) {
    body { padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); gap: 10px; }
    .stage { min-height: 0; }
    #bubble { top: 52px; }
  }
</style>
</head>
<body>
  <section class="stage">
    <canvas id="avatar"></canvas>
    <div id="bubble"></div>
    <button type="button" id="reset">대화 초기화</button>
    <div id="mixbars"></div>
    <div class="emotion" id="emotion">neutral</div>
    <div class="hud"><span id="fps"></span></div>
    <div id="debug">
      <div id="emoButtons"></div>
      <div id="sliders"></div>
      <button type="button" id="dbgReset" style="margin-top:8px">슬라이더 초기화</button>
    </div>
  </section>
  <span id="status" hidden></span>
  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="메시지를 입력하세요" enterkeyhint="send">
    <button class="primary" id="send" type="submit">보내기</button>
  </form>
  <script type="module" src="js/main.js"></script>
</body>
</html>
